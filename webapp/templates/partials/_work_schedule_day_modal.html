{% set f = form or {} %}
<div class="modal-backdrop">
  <div class="modal">
    <form hx-post="{{ url_for('work_schedules.update_days', employment_id=e.employment_id, year=year) }}"
          hx-target="#work-schedule-panel" hx-swap="outerHTML">
      <div class="mhead">
        <h3>📆 Ημερήσιο πρόγραμμα — {{ e.full_name }}</h3>
        <span class="muted" style="font-size:12.5px">
          Υπερισχύει του εβδομαδιαίου · κενό ωράριο = ΡΕΠΟ ·
          σπαστό: 09:00-13:00+16:00-20:00 · πρόθεμα Τ = τηλεεργασία
        </span>
      </div>
      <div class="mbody">
        <div class="frm cols">
          <label>Από<input type="date" name="date_from"
            value="{{ f.get('date_from', selected.isoformat()) }}" required></label>
          <label>Έως<input type="date" name="date_to"
            value="{{ f.get('date_to', selected.isoformat()) }}" required></label>
          <label class="wide">Ωράριο (κενό = ΡΕΠΟ)
            <input name="hours" placeholder="ρεπό" data-time-rail
                   value="{{ f.get('hours', current_hours) }}"></label>
        </div>
      </div>
      <div class="mfoot">
        <button type="button" class="ghost"
                hx-get="{{ url_for('work_schedules.modal_close') }}"
                hx-target="#modal-host" hx-swap="innerHTML">Άκυρο</button>
        <button class="run" type="submit">Αποθήκευση στο grid</button>
      </div>
    </form>
  </div>
</div>
